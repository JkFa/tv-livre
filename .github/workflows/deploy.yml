name: Publicar TV Livre

on:
  push:
    branches: [main]
  schedule:
    - cron: '17 6 * * *' # completa: dados + teste de links + guia (03:17 em Brasília)
    - cron: '17 18 * * *' # só o guia de programação, sem testar links (15:17 em Brasília)
  workflow_dispatch:

permissions:
  contents: read

# Uma publicação por vez; não cancela a que está em andamento para nunca deixar o site pela metade.
concurrency:
  group: pages
  cancel-in-progress: false

env:
  SITE_URL: https://jkfa.github.io/tv-livre
  # A execução das 18:17 UTC só renova o guia: não testa links (reaproveita o status da publicação anterior).
  EPG_ONLY: ${{ github.event.schedule == '17 18 * * *' }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Lint, tipos e testes unitários
        run: npm run check

      # Baixa as duas fontes, une, filtra, testa os links e grava public/data.
      # Falha (e portanto NÃO publica) se uma fonte estiver fora do ar ou se o total cair mais de 50%.
      - name: Pipeline de dados
        if: env.EPG_ONLY != 'true'
        run: npm run data

      - name: 'Pipeline de dados (só o guia: sem testar links, reaproveita o status anterior)'
        if: env.EPG_ONLY == 'true'
        run: npm run data -- --reuse-health

      # Guia de programação (EPG) com o iptv-org/epg. É OPCIONAL: se a coleta falhar ou demorar demais, o
      # deploy continua sem o guia (ou com o último guia ainda válido) e o motivo aparece como aviso no resumo.
      - name: Guia de programação (EPG)
        continue-on-error: true
        timeout-minutes: 40
        run: |
          git clone --depth 1 https://github.com/iptv-org/epg.git "$RUNNER_TEMP/epg"
          (cd "$RUNNER_TEMP/epg" && HUSKY=0 npm ci --no-audit --no-fund)
          npm run epg -- --epg-dir "$RUNNER_TEMP/epg"

      # VITE_PRESENCA_URL = endereço do serviço "assistindo agora" (variável do repositório PRESENCA_URL, não é segredo).
      # Sem ela o site é construído como antes: contador do Abacus e nenhuma conexão de presença.
      - name: Build
        run: npm run build
        env:
          VITE_PRESENCA_URL: ${{ vars.PRESENCA_URL }}

      # Páginas estáticas indexáveis (um HTML por canal elegível, categorias, países, prévias OG e sitemap).
      # As prévias são renderizadas com o Chromium do Playwright.
      - name: Navegadores do Playwright
        run: npx playwright install --with-deps chromium webkit

      - name: Páginas indexáveis e sitemap
        run: npm run build:pages

      # O E2E da presença sobe o Worker de verdade (wrangler dev, local): precisa das dependências de workers/presenca.
      - name: Dependências do serviço de presença (para o E2E)
        run: npm ci --prefix workers/presenca --no-audit --no-fund

      - name: 'Testes de ponta a ponta (Playwright em Chromium e WebKit; Android, iPhone e desktop emulados)'
        run: npm run test:e2e

      # Registros (trace, captura, contexto do erro) das tentativas que falharam, inclusive das que passaram na segunda
      # tentativa: é o que permite investigar falhas raras do CI. Só os testes que falham deixam arquivos; sem falha, nada sobe.
      - name: Registros dos testes que falharam
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: e2e-falhas
          path: test-results/
          if-no-files-found: ignore
          retention-days: 14

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

      - name: Resumo dos dados
        if: always()
        run: |
          if [ -f dist/data/index.json ]; then
            node -e 'const m=require("./dist/data/index.json").meta;console.log(`## Dados\n\n- Total: **${m.total}**\n- Por fonte: ${JSON.stringify(m.bySource)}\n- Por status: ${JSON.stringify(m.byStatus)}\n- Por tipo: ${JSON.stringify(m.byKind)}`)' >> "$GITHUB_STEP_SUMMARY"
          fi

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
