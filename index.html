    <script>
      // aplica o tema salvo antes da primeira pintura (evita piscar claro/escuro)
      try {
        var t = localStorage.getItem('tvlivre:tema');
        var r = document.documentElement;
        r.dataset.theme = t === 'claro' ? 'light' : t === 'escuro' ? 'dark' : 'auto';
        var dark = t === 'escuro' || (t !== 'claro' && matchMedia('(prefers-color-scheme: dark)').matches);
        document.querySelector('meta[name="theme-color"]').setAttribute('content', dark ? '#15110e' : '#efe6d2');
      } catch (e) {}
    </script>
